{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="text-center mb-4">Iniciar sesión</h3>

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>

                <p class="text-center mt-3">
                    ¿No tenés cuenta?
                    <a href="/registro/">Registrate</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
