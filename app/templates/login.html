{% extends 'base.html' %}

{% block contenido %}

<div class="card form-card">
    <div class="card-body">
        <h3 style="text-align:center;">Iniciar sesión</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary btn-full">Entrar</button>
        </form>

        <p style="text-align:center; margin-top:18px; font-size:.88rem; color:var(--muted);">
            ¿No tenés cuenta?
            <a href="/registro/" style="color:var(--accent); font-weight:600;">Registrate</a>
        </p>
    </div>
</div>

{% endblock %}
