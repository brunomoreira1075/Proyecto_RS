{% extends 'base.html' %}

{% block contenido %}

<h2>
    #{{ hashtag.nombre }}
</h2>

<hr>

{% for post in posts %}

    <div class="card mb-3">
        <div class="card-body">

            <h5>
                @{{ post.usuario.username }}
            </h5>

            <p>
                {{ post.contenido }}
            </p>

        </div>
    </div>

{% empty %}

    <p>
        No hay publicaciones.
    </p>

{% endfor %}

{% endblock %}
