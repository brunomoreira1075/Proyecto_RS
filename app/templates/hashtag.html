{% extends 'base.html' %}

{% block contenido %}

<div class="container mt-4">

    <h2>#{{ hashtag.nombre }}</h2>

    <hr>

    {% for post in posts %}

        <div class="card shadow-sm mb-3">

            <div class="card-body">

                <h5>
                    <a href="{% url 'perfil' post.usuario.username %}">
                        @{{ post.usuario.username }}
                    </a>
                </h5>

                <p>{{ post.contenido }}</p>

                <small class="text-muted">
                    {{ post.fecha_creacion }}
                </small>

            </div>

        </div>

    {% empty %}

        <div class="alert alert-warning">
            No existen publicaciones con este hashtag.
        </div>

    {% endfor %}

</div>

{% endblock %}
