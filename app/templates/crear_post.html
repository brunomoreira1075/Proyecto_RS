{% extends 'base.html' %}

{% block contenido %}

<div class="card form-card">
    <div class="card-body">
        <h3>Nueva publicación</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div style="display:flex; gap:10px; margin-top:6px;">
                <button class="btn btn-primary">Publicar</button>
                <a href="/" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
