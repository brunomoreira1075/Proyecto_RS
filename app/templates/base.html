<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTwitter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
    :root{
        --bg:#F4F6F5;
        --surface:#FFFFFF;
        --ink:#191B22;
        --muted:#6E7380;
        --muted-soft:#9A9EA8;
        --accent:#5B4B8A;
        --accent-dark:#463869;
        --accent-soft:#EEEAF9;
        --like:#E0587A;
        --like-soft:#FCE8ED;
        --success:#2F9E6B;
        --success-soft:#E5F5EE;
        --border:#E7E7EA;
        --radius-lg:20px;
        --radius:16px;
        --radius-sm:10px;
        --radius-pill:999px;
        --shadow-rest:0 1px 2px rgba(20,20,30,.04);
        --shadow-hover:0 10px 28px rgba(20,20,30,.08);
        --font-display:'Sora', system-ui, sans-serif;
        --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono:'JetBrains Mono', ui-monospace, monospace;
    }

    *{ box-sizing:border-box; }

    html,body{
        margin:0;
        padding:0;
        background:var(--bg);
        color:var(--ink);
        font-family:var(--font-body);
        -webkit-font-smoothing:antialiased;
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
        max-width:600px;
        margin:0 auto;
        padding:24px 16px 80px;
    }

    /* ---------- Navbar ---------- */
    .navbar{
        position:sticky;
        top:0;
        z-index:50;
        background:rgba(244,246,245,.85);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
        border-bottom:1px solid var(--border);
    }

    .navbar-inner{
        max-width:600px;
        margin:0 auto;
        padding:14px 16px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        flex-wrap:wrap;
    }

    .brand{
        font-family:var(--font-display);
        font-weight:800;
        font-size:1.15rem;
        display:flex;
        align-items:center;
        gap:8px;
        color:var(--ink);
        letter-spacing:-.02em;
    }

    .brand-dot{
        width:9px;
        height:9px;
        border-radius:50%;
        background:var(--accent);
        display:inline-block;
    }

    .nav-actions{
        display:flex;
        align-items:center;
        gap:8px;
        flex-wrap:wrap;
    }

    /* ---------- Buttons ---------- */
    .btn{
        font-family:var(--font-display);
        font-weight:600;
        font-size:.85rem;
        padding:8px 16px;
        border-radius:var(--radius-pill);
        border:1px solid transparent;
        cursor:pointer;
        display:inline-flex;
        align-items:center;
        gap:6px;
        transition:transform .1s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
        line-height:1.2;
    }
    .btn:active{ transform:scale(.97); }

    .btn-primary{
        background:var(--accent);
        color:#fff;
    }
    .btn-primary:hover{ background:var(--accent-dark); }

    .btn-ghost{
        background:transparent;
        border-color:var(--border);
        color:var(--ink);
    }
    .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }

    .btn-outline-accent{
        background:transparent;
        border-color:var(--accent);
        color:var(--accent);
    }
    .btn-outline-accent:hover{ background:var(--accent-soft); }

    .btn-danger{
        background:transparent;
        border-color:var(--like);
        color:var(--like);
    }
    .btn-danger:hover{ background:var(--like-soft); }

    .btn-sm{ padding:6px 12px; font-size:.78rem; }
    .btn-full{ width:100%; justify-content:center; }
    .btn-icon{ font-size:.95em; }

    form.inline{ display:inline; margin:0; }

    /* ---------- Cards ---------- */
    .card{
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:var(--radius-lg);
        box-shadow:var(--shadow-rest);
        transition:box-shadow .2s ease, transform .2s ease;
    }
    .card-body{ padding:20px; }

    .form-card{
        max-width:440px;
        margin:24px auto;
    }
    .form-card h3, .form-card h2{
        font-family:var(--font-display);
        font-weight:700;
        margin:0 0 20px;
        letter-spacing:-.01em;
    }
    .form-card .card-body{ padding:28px; }

    .page-title{
        font-family:var(--font-display);
        font-weight:800;
        font-size:1.5rem;
        letter-spacing:-.02em;
        margin:0 0 18px;
    }

    /* ---------- Post card ---------- */
    .post{
        margin-bottom:16px;
    }
    .post:hover{ box-shadow:var(--shadow-hover); }

    .post-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
    }

    .post-author{
        display:flex;
        align-items:center;
        gap:10px;
    }

    .avatar{
        width:40px;
        height:40px;
        border-radius:50%;
        background:var(--accent-soft);
        color:var(--accent-dark);
        font-family:var(--font-display);
        font-weight:700;
        font-size:.95rem;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-shrink:0;
        overflow:hidden;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; }

    .avatar-lg{
        width:88px;
        height:88px;
        font-size:2rem;
        border:3px solid var(--surface);
        box-shadow:0 0 0 1px var(--border);
    }

    .username-link{
        font-family:var(--font-display);
        font-weight:700;
        font-size:.95rem;
    }
    .username-link:hover{ color:var(--accent); }

    .timestamp{
        font-family:var(--font-mono);
        font-size:.72rem;
        color:var(--muted-soft);
        white-space:nowrap;
    }

    .post-content{
        margin:12px 0 0;
        font-size:.98rem;
        line-height:1.55;
        color:var(--ink);
        white-space:pre-wrap;
    }

    .hashtags{
        display:flex;
        flex-wrap:wrap;
        gap:6px;
        margin-top:12px;
    }

    .tag{
        background:var(--accent-soft);
        color:var(--accent-dark);
        font-family:var(--font-mono);
        font-size:.72rem;
        font-weight:600;
        padding:4px 10px;
        border-radius:var(--radius-pill);
    }
    .tag:hover{ background:var(--accent); color:#fff; }

    .post-actions{
        display:flex;
        align-items:center;
        gap:8px;
        margin-top:16px;
        padding-top:14px;
        border-top:1px solid var(--border);
    }

    .like-btn{
        background:transparent;
        border:1px solid var(--border);
        color:var(--muted);
        font-family:var(--font-mono);
        font-weight:600;
        font-size:.8rem;
        padding:7px 14px;
        border-radius:var(--radius-pill);
        cursor:pointer;
        display:inline-flex;
        align-items:center;
        gap:6px;
        transition:.15s ease;
    }
    .like-btn:hover{
        border-color:var(--like);
        color:var(--like);
        background:var(--like-soft);
    }

    /* ---------- Comments ---------- */
    .comments{
        margin-top:16px;
    }
    .comments-label{
        font-family:var(--font-display);
        font-weight:700;
        font-size:.78rem;
        text-transform:uppercase;
        letter-spacing:.05em;
        color:var(--muted);
        margin:0 0 10px;
    }

    .comment{
        display:flex;
        gap:10px;
        padding:10px 0;
        border-top:1px solid var(--border);
    }
    .comment:first-of-type{ border-top:none; }

    .comment-avatar{
        width:28px;
        height:28px;
        font-size:.7rem;
    }

    .comment-body strong{
        font-family:var(--font-display);
        font-size:.85rem;
    }
    .comment-body p{
        margin:2px 0 0;
        font-size:.88rem;
        color:var(--ink);
        line-height:1.4;
    }

    .empty-note{
        color:var(--muted-soft);
        font-size:.85rem;
        font-style:italic;
    }

    .comment-form{
        display:flex;
        gap:8px;
        margin-top:14px;
    }
    .comment-form input[type="text"]{
        flex:1;
        border:1px solid var(--border);
        border-radius:var(--radius-pill);
        padding:9px 16px;
        font-size:.85rem;
        font-family:var(--font-body);
        background:var(--bg);
    }
    .comment-form input[type="text"]:focus{
        outline:none;
        border-color:var(--accent);
        background:#fff;
        box-shadow:0 0 0 3px var(--accent-soft);
    }
    .comment-form button{
        border-radius:var(--radius-pill);
        padding:9px 16px;
    }

    /* ---------- Alerts / empty states ---------- */
    .alert{
        border-radius:var(--radius);
        padding:16px 18px;
        font-size:.9rem;
        border:1px solid transparent;
    }
    .alert-info{ background:var(--accent-soft); color:var(--accent-dark); }
    .alert-warning{ background:#FFF6E6; color:#8A5A00; border-color:#F5E3B8; }

    /* ---------- Generic Django forms (form.as_p) ---------- */
    form p{
        display:flex;
        flex-direction:column;
        gap:6px;
        margin:0 0 16px;
    }
    form label{
        font-family:var(--font-display);
        font-size:.72rem;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.05em;
        color:var(--muted);
    }
    form input[type="text"],
    form input[type="password"],
    form input[type="email"],
    form input[type="url"],
    form input[type="number"],
    form input[type="file"],
    form textarea,
    form select{
        padding:12px 14px;
        border-radius:var(--radius-sm);
        border:1px solid var(--border);
        font-family:var(--font-body);
        font-size:.92rem;
        background:var(--bg);
        color:var(--ink);
        transition:.15s ease;
        width:100%;
    }
    form input:focus, form textarea:focus, form select:focus{
        outline:none;
        border-color:var(--accent);
        background:#fff;
        box-shadow:0 0 0 3px var(--accent-soft);
    }
    form textarea{ min-height:110px; resize:vertical; }

    /* ---------- Search ---------- */
    .search-bar{
        display:flex;
        gap:8px;
        margin-bottom:20px;
    }
    .search-bar input[type="text"]{
        flex:1;
        border:1px solid var(--border);
        border-radius:var(--radius-pill);
        padding:13px 20px;
        font-size:.95rem;
        background:var(--surface);
    }
    .search-bar input[type="text"]:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-soft);
    }
    .search-bar button{ border-radius:var(--radius-pill); padding:0 22px; }

    .result-row{
        display:flex;
        align-items:center;
        gap:12px;
        padding:14px 16px;
        border-bottom:1px solid var(--border);
        transition:background .15s ease;
    }
    .result-row:hover{ background:var(--surface); border-radius:var(--radius-sm); }
    .result-row:last-child{ border-bottom:none; }

    /* ---------- Profile ---------- */
    .profile-header{
        display:flex;
        gap:18px;
        align-items:flex-start;
        margin-bottom:22px;
        flex-wrap:wrap;
    }
    .profile-name{
        font-family:var(--font-display);
        font-weight:800;
        font-size:1.4rem;
        letter-spacing:-.02em;
        margin:0 0 8px;
    }
    .profile-stats{
        display:flex;
        gap:22px;
        margin:10px 0 14px;
    }
    .profile-stat .num{
        font-family:var(--font-mono);
        font-weight:600;
        font-size:1.05rem;
        display:block;
    }
    .profile-stat .lbl{
        font-size:.72rem;
        color:var(--muted);
        text-transform:uppercase;
        letter-spacing:.04em;
    }
    .profile-actions{ display:flex; gap:8px; flex-wrap:wrap; }

    .divider{
        border:none;
        border-top:1px solid var(--border);
        margin:20px 0;
    }

    @media (max-width:480px){
        .navbar-inner{ padding:12px; }
        .card-body{ padding:16px; }
        .profile-header{ gap:14px; }
    }
    /* ===== Feed ===== */

.feed-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
}

.feed-left{
    display:flex;
    align-items:center;
    gap:14px;
    flex:1;
}

.feed-info{
    display:flex;
    flex-direction:column;
}

.feed-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1rem;
    margin:0;
}

.feed-user{
    color:var(--muted);
    font-size:.88rem;
    margin-top:2px;
}

.feed-date{
    color:var(--muted-soft);
    font-size:.72rem;
    margin-top:4px;
    font-family:var(--font-mono);
}

.feed-follow{
    display:flex;
    align-items:center;
}

.feed-content{
    margin-top:18px;
    margin-left:74px;
}

.feed-actions{
    margin-top:18px;
    margin-left:74px;
}

.feed-comments{
    margin-top:22px;
    margin-left:74px;
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" href="/">
            <span class="brand-dot"></span>MiniTwitter
        </a>

        <div class="nav-actions">
        {% if user.is_authenticated %}
                <a class="btn btn-ghost btn-sm" href="/perfil/{{ user.username }}/">
                    Mi perfil
                </a>

                <a class="btn btn-primary btn-sm" href="/crear/">
                    <span class="btn-icon">+</span>Publicar
                </a>

                <a class="btn btn-ghost btn-sm" href="/buscar/">
                    Buscar
                </a>

                <form method="POST" action="/logout/" class="inline">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm">Salir</button>
                </form>
            {% else %}
                <a class="btn btn-ghost btn-sm" href="/login/">Login</a>
                <a class="btn btn-primary btn-sm" href="/registro/">Registro</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="wrap">
    {% block contenido %}
    {% endblock %}
</div>

</body>
</html>
