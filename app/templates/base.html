<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Red Social</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MiniTwitter</a>

        <div>
            {% if user.is_authenticated %}
                <a class="btn btn-outline-light btn-sm" href="/crear/">Publicar</a>
                <a class="btn btn-outline-light btn-sm" href="/buscar/">Buscar</a>

                <form method="POST" action="/logout/" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-danger btn-sm">Salir</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="/login/">Login</a>
                <a class="btn btn-primary btn-sm" href="/registro/">Registro</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block contenido %}
    {% endblock %}
</div>

</body>
</html>
